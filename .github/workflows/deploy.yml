name: Deploy Backend to Google Cloud Run

on:
  push:
    branches:
      - demo
  workflow_dispatch:

env:
  SERVICE_NAME: assessment-backend
  REGION: asia-southeast1

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}

      - name: Create .env file
        run: |
          cat << 'EOF' > .env
          ${{ secrets.ENV }}
          EOF

      - name: Copy .env to Compute Engine
        run: |
          gcloud compute scp .env assessment-service:~/assessment-backend.env --zone=asia-southeast1-a

      - name: Deploy to Compute Engine
        run: |
          gcloud compute ssh assessment-service --zone=asia-southeast1-a --command="
            sudo docker pull docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            sudo docker stop ${{ env.SERVICE_NAME }} || true
            sudo docker rm ${{ env.SERVICE_NAME }} || true
            sudo docker run -d --name ${{ env.SERVICE_NAME }} \
              --restart unless-stopped \
              --network traefik-public \
              --env-file ~/assessment-backend.env \
              --label 'traefik.enable=true' \
              --label 'traefik.http.routers.backend.rule=Host(\`assessment-backend.molika.app\`)' \
              --label 'traefik.http.routers.backend.entrypoints=websecure' \
              --label 'traefik.http.routers.backend.tls.certresolver=myresolver' \
              --label 'traefik.http.services.backend.loadbalancer.server.port=3001' \
              docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ env.SERVICE_NAME }}:${{ github.sha }}
            sudo docker system prune -af
          "
